<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Jy Workout</title>
<style>
:root{
  --brand:#2453f5;--ink:#0f172a;--sub:#64748b;
  --bg:#ffffff;--card:#fff;
  --shadow:0 18px 48px rgba(15,23,42,.10);
  --btn-secondary-bg:#f0f2f5;--btn-disabled-bg:#f0f2f5;--btn-disabled-text:#c8cdd6;
  --tag-pull-bg:#dcfce7;--tag-pull-ink:#16a34a;
  --tag-push-bg:#e4ecff;--tag-push-ink:#2453f5;
  --tag-legs-bg:#ffe6bf;--tag-legs-ink:#b45309;
  --tag-shoulders-bg:#ffe4f1;--tag-shoulders-ink:#be185d;
  --tag-abs-bg:#d1fae5;--tag-abs-ink:#0f766e;
  --tag-cardio-bg:#fef3c7;--tag-cardio-ink:#a16207;
  --tag-pb-bg:#fff7d1;--tag-pb-ink:#b45309;
  --green:#16a34a;--green-light:#dcfce7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#f8f9fb;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Segoe UI,sans-serif;
  background:#fff;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  touch-action:pan-y;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}

/* ── APP SHELL ── */
/* pages track — slides horizontally */
.pages-track{
  display:flex;
  flex-direction:row;
  width:200%;
  height:100%;
  transform:translateX(0);
  transition:transform .42s cubic-bezier(.25,.1,.1,1);
  will-change:transform;
  isolation:isolate;
}
.pages-track.show-history{
  transform:translateX(-50%);
}
/* when snap is called, inline style is cleared — class takes over with transition */

/* history panel = left page */
.history-panel{
  width:50%;
  height:100%;
  display:flex;flex-direction:column;
  background:#f8f9fb;
  flex-shrink:0;
  overflow:hidden;
  position:relative;
  z-index:0;
}
.history-panel-body{flex:1;overflow-y:auto;scrollbar-width:none;padding:0;padding-bottom:calc(130px + env(safe-area-inset-bottom));}
.history-panel-body::-webkit-scrollbar{display:none;}
/* when history is showing, boost its z-index above all fixed overlays */
.pages-track.show-history .history-panel{
  z-index:500;
}

/* main app = right page */
.app{
  width:50%;
  height:100%;
  display:flex;flex-direction:column;
  background:#f8f9fb;
  flex-shrink:0;
  animation:appIn .6s cubic-bezier(.2,.8,.2,1) forwards;
  padding-bottom:calc(130px + env(safe-area-inset-bottom));
}
@keyframes appIn{from{opacity:0}to{opacity:1}}

/* fixed dock — outside track, always visible */
.dock{
  position:fixed;
  bottom:0;left:0;right:0;
  padding:12px 1rem calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:0;
  z-index:200;
  background:linear-gradient(to top,rgba(248,249,251,0.95) 55%,rgba(248,249,251,0));
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  pointer-events:auto;
  transition:opacity .3s;
  max-width:520px;
  margin:0 auto;
}
.dock.faded{opacity:0;pointer-events:none;height:0;overflow:hidden;padding:0;min-height:0;-webkit-backdrop-filter:none;backdrop-filter:none;background:none;}

/* page indicator dots */
.page-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(15,23,42,.18);
  transition:background .3s,transform .3s;
}
.page-dot.active{background:var(--brand);transform:scale(1.25);}
.history-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 12px;
  border-bottom:1px solid rgba(15,23,42,.07);
  flex-shrink:0;
}
.history-panel-title{font-size:20px;font-weight:700;letter-spacing:-.03em;}
.history-panel-count{font-size:13px;color:var(--sub);}
.history-row{
  padding:16px 20px;
  border-bottom:1px solid rgba(15,23,42,.06);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.h-title{font-size:15px;font-weight:600;color:var(--ink);}
.h-date{font-size:12px;color:var(--sub);margin-top:3px;}
.h-sub{font-size:12px;color:#94a3b8;margin-top:5px;line-height:1.5;}
.h-del{background:none;border:none;font-size:20px;color:#c8cdd6;cursor:pointer;padding:0;flex-shrink:0;line-height:1;}
.h-del:active{color:#ef4444;}
.h-tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid rgba(15,23,42,.07);flex-shrink:0;}
.h-tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;margin-bottom:-1px;transition:color .2s,border-color .2s;}
.h-tab.active{color:var(--brand);border-bottom-color:var(--brand);}
.h-empty{padding:48px 20px;text-align:center;color:var(--sub);font-size:15px;}

/* history cards */
.h-card{
  background:#fff;border-radius:20px;
  box-shadow:0 2px 12px rgba(15,23,42,.07);
  margin:12px 16px;
}
.h-card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 18px 12px;
  border-bottom:1px solid rgba(15,23,42,.06);
}
.h-card-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.h-card-title{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.03em;}
.h-card-meta{font-size:12px;color:var(--sub);margin-top:4px;}
.h-card-total{text-align:right;flex-shrink:0;}
.h-card-total-num{font-size:28px;font-weight:800;color:var(--brand);letter-spacing:-.04em;line-height:1;}
.h-card-total-label{font-size:11px;color:var(--sub);margin-top:2px;}
.h-ex-list{padding:8px 0 0;}
.h-ex-row{
  display:flex;align-items:center;
  padding:11px 18px;
  border-bottom:1px solid rgba(15,23,42,.04);
  gap:12px;
}
.h-ex-row:last-child{border-bottom:none;}
.h-ex-reps{font-size:15px;font-weight:700;color:var(--ink);flex-shrink:0;min-width:28px;}
.h-ex-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.h-ex-name{font-size:14px;font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-trophy{font-size:13px;line-height:1;}
.h-ex-pill{flex-shrink:0;margin-left:auto;}
.h-del-btn{
  display:block;width:100%;margin:0;
  height:40px;border:none;border-radius:999px;
  background:#f5f5f7;color:#ef4444;
  font-size:14px;font-weight:600;cursor:pointer;
  box-sizing:border-box;
}
.h-del-btn:active{background:#ffe0e0;}
.h-card-footer{padding:8px 18px 18px;}

/* swipe hint dot indicator */
.page-dots{
  display:flex;gap:6px;
  justify-content:center;
  padding-bottom:0.5rem;
  transition:opacity .3s;
}
.page-dot{width:6px;height:6px;border-radius:50%;background:rgba(15,23,42,.15);transition:background .3s,transform .3s;}
.page-dot.active{background:var(--brand);transform:scale(1.3);}



/* ── TOP BAR ── */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 1rem 8px;min-height:52px;flex-shrink:0;
}
.top-bar-title{font-size:15px;font-weight:700;opacity:0;transition:opacity .3s;}
.top-bar-title.show{opacity:1;}
.tba{background:none;border:none;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;padding:8px;transition:opacity .2s;}
.tba:active{opacity:.6;}
.tba.hidden{opacity:0;pointer-events:none;}

/* ── CENTRE STAGE ── */
.center{
  flex:1;display:flex;align-items:flex-start;justify-content:center;
  padding:16px 1rem 0;position:relative;overflow:hidden;
}

/* ── HOME ── */
.home-view{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .4s,transform .4s;
}
.home-view.hidden{opacity:0;pointer-events:none;transform:scale(.96);}
.big-number{font-size:140px;font-weight:900;letter-spacing:-.05em;color:rgba(15,23,42,.07);line-height:1;}
.home-label{font-size:15px;color:var(--sub);margin-top:10px;font-weight:400;text-align:center;}
.home-streak{font-weight:600;color:var(--ink);}

/* ── PREVIEW CARD ── */
.workout-card{
  background:var(--card);border-radius:22px;
  box-shadow:var(--shadow);padding:22px 22px 20px;
  position:absolute;top:0;left:1rem;right:1rem;
  opacity:0;transform:translateY(20px) scale(.97);
  transition:opacity .4s ease,transform .4s cubic-bezier(.18,.89,.32,1.2);
  pointer-events:none;
  max-height:calc(100vh - 200px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.workout-card::-webkit-scrollbar{display:none;}
.workout-card.visible{opacity:1;transform:none;pointer-events:auto;}
.workout-card.hidden{display:none;}
.card-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.card-title{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;}
.card-subtitle{font-size:14px;color:var(--sub);margin-bottom:20px;line-height:1.4;}
.preview-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(15,23,42,.05);}
.preview-row:last-child{border-bottom:none;}
.preview-name{font-size:16px;font-weight:500;color:#334155;}
.preview-tags{display:flex;gap:6px;align-items:center;}
.pill{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;text-transform:capitalize;}
.pill-pull{background:var(--tag-pull-bg);color:var(--tag-pull-ink);}
.pill-push{background:var(--tag-push-bg);color:var(--tag-push-ink);}
.pill-legs{background:var(--tag-legs-bg);color:var(--tag-legs-ink);}
.pill-shoulders{background:var(--tag-shoulders-bg);color:var(--tag-shoulders-ink);}
.pill-abs{background:var(--tag-abs-bg);color:var(--tag-abs-ink);}
.pill-cardio{background:var(--tag-cardio-bg);color:var(--tag-cardio-ink);}
.pill-pb{background:var(--tag-pb-bg);color:var(--tag-pb-ink);}
.pill-weight{background:#fdf4ff;color:#7c3aed;font-size:12px;}

/* ── BASELINE VIEW ── */
.baseline-view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:translateY(20px);
  transition:opacity .4s,transform .4s;
  padding:28px 24px 0;
  background:#f8f9fb;
}
.baseline-view.visible{opacity:1;pointer-events:auto;transform:none;}
.baseline-view.visible{opacity:1;pointer-events:auto;transform:none;}
.bl-step{font-size:12px;font-weight:600;color:#c0c8d8;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}

.bl-name-row{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.bl-weight-pill{display:none;}
.bl-weight-pill.visible{display:inline-block;}
.bl-name{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;color:var(--ink);}
.bl-sub{font-size:14px;color:#94a3b8;margin-bottom:0;line-height:1.5;}
.pin-display{
  font-size:100px;font-weight:700;letter-spacing:-.06em;
  color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums;
  margin:auto 0;text-align:center;
  transition:color .15s;
}
.pin-display.zero{color:#e2e8f0;}
.pin-display.has-value{color:var(--brand);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;}
.numpad-btn{
  height:68px;border-radius:999px;border:none;
  background:transparent;
  font-size:26px;font-weight:400;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:opacity .1s;
  -webkit-tap-highlight-color:transparent;
}
.numpad-btn:active{opacity:.35;}
.numpad-btn.del{font-size:19px;color:#ef4444;}
.numpad-btn.ok{
  background:var(--brand);color:white;
  border-radius:999px;font-size:20px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .1s;
}
.numpad-btn.ok:active{transform:scale(.93);}
.bl-spacer{flex:1;}
.bl-numpad-area{
  flex-shrink:0;
  padding:0 0 calc(14px + env(safe-area-inset-bottom));
  width:100%;
}

/* ═══════════════════════════════════════════
   WORKOUT SCREEN
═══════════════════════════════════════════ */
.workout-screen{
  position:fixed;inset:0;
  background:#f8f9fb;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  z-index:50;
  opacity:0;pointer-events:none;visibility:hidden;
  transform:translateY(28px) scale(.985);
  transition:opacity .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1),visibility 0s .4s;
}
.workout-screen.visible{opacity:1;pointer-events:auto;transform:none;visibility:visible;transition:opacity .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1),visibility 0s 0s;}

.ws-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px 10px;flex-shrink:0;
}
.ws-timer{font-size:13px;font-weight:600;color:#c0c8d8;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.ws-quit{background:none;border:none;font-size:14px;font-weight:500;color:#ef4444;cursor:pointer;padding:0;transition:opacity .15s;}
.ws-quit:active{opacity:.4;}

/* scrollable accordion area */
.ws-accordion-list{
  flex:1;overflow-y:auto;
  padding:0;
  display:flex;flex-direction:column;gap:0;
  scrollbar-width:none;
}
.ws-accordion-list::-webkit-scrollbar{display:none;}

/* accordion card — Trade Republic list style */
.ws-acc{
  background:#fff;
  border-bottom:1px solid rgba(15,23,42,.07);
  flex-shrink:0;
  transition:background .2s;
}
.ws-acc:first-child{border-top:1px solid rgba(15,23,42,.07);}
.ws-acc.open{background:#fafbff;}
.ws-acc.done .ws-acc-header{opacity:.4;}

.ws-acc-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;cursor:pointer;gap:12px;
  -webkit-tap-highlight-color:transparent;
}
.ws-acc-header:active{background:rgba(15,23,42,.03);}

.ws-acc-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}

.ws-acc-icon{
  width:40px;height:40px;border-radius:12px;
  background:#f0f2f5;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:15px;font-weight:700;color:#94a3b8;
  transition:background .2s,color .2s;
}
.ws-acc.open .ws-acc-icon{background:#e8edf8;color:var(--brand);}
.ws-acc.done .ws-acc-icon{background:var(--green-light);color:var(--green);}

.ws-acc-info{flex:1;min-width:0;}
.ws-acc-name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ws-acc-meta{font-size:12px;color:#94a3b8;margin-top:1px;font-weight:400;}

.ws-acc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ws-acc-tally{font-size:18px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;min-width:24px;text-align:right;}
.ws-acc-tally.done-tally{color:var(--green);}
.ws-acc-check{width:24px;height:24px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:12px;transition:background .2s,transform .2s;flex-shrink:0;}
.ws-acc.done .ws-acc-check{background:var(--green-light);color:var(--green);transform:scale(1.1);}

/* accordion body */
.ws-acc-body{overflow:hidden;height:0;opacity:0;transition:height .55s cubic-bezier(.25,.1,.1,1),opacity .45s cubic-bezier(.25,.1,.1,1);}
.ws-acc.open .ws-acc-body{}

.ws-acc-inner{padding:0 20px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;}

.ws-acc-bignum{
  font-size:88px;font-weight:700;letter-spacing:-.06em;
  color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),color .2s;
}
.ws-acc-bignum.typing{color:var(--brand);}
.ws-acc-bignum.bump{transform:scale(1.1);}

.ws-acc-sublabel{font-size:13px;color:#94a3b8;font-weight:400;}

.ws-acc-bar-wrap{width:100%;height:2px;background:#e8edf8;border-radius:999px;overflow:hidden;}
.ws-acc-bar{height:100%;background:var(--brand);border-radius:999px;transition:width .5s cubic-bezier(.16,1,.3,1);}

/* fixed bottom panel */
.ws-bottom{
  flex-shrink:0;
  padding:0 16px;
  background:#f8f9fb;
  display:none;
}
.workout-screen.visible .ws-bottom{
  display:block;
}
.ws-numpad-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;padding-top:8px;
}
.slide-wrap{display:none;width:100%;height:52px;border-radius:999px;background:#eef2ff;position:relative;overflow:hidden;touch-action:pan-y;margin-top:8px;margin-bottom:calc(12px + env(safe-area-inset-bottom));}
.slide-wrap.show{display:block;}

.ws-acc-log-btn{
  width:100%;height:52px;border-radius:999px;border:none;
  font-size:17px;font-weight:600;cursor:pointer;
  background:var(--brand);color:white;
  margin-bottom:8px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .2s;
}
.ws-acc-log-btn:not(:disabled):active{transform:scale(.97);}
.ws-acc-log-btn:disabled{background:var(--btn-disabled-bg);color:var(--btn-disabled-text);cursor:not-allowed;}

.ws-nk{
  height:62px;border-radius:999px;border:none;
  background:transparent;font-size:26px;font-weight:400;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:opacity .1s;-webkit-tap-highlight-color:transparent;
}
.ws-nk:active{opacity:.35;}
.ws-nk.del{font-size:20px;color:#ef4444;}
.nk-confirm{
  width:56px;height:56px;border-radius:50%;border:none;
  background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:opacity .15s,transform .15s,background .2s;
  -webkit-tap-highlight-color:transparent;
  margin:auto;
}
.nk-confirm:disabled{background:#e8edf8;color:#c0c8d8;cursor:not-allowed;}
.nk-confirm:not(:disabled):active{transform:scale(.92);opacity:.85;}

/* ── ACTIONS (home/preview states) ── */
.actions{
  padding:12px 1rem 18px;display:flex;flex-direction:column;gap:0;
  z-index:10;flex-shrink:0;transition:opacity .3s;
}
.actions.faded{opacity:0;pointer-events:none;height:0;overflow:hidden;padding:0;}
.btn{width:100%;height:52px;border:none;border-radius:999px;font-size:17px;font-weight:700;cursor:pointer;background:var(--brand);color:white;transition:transform .1s,opacity .2s;display:flex;align-items:center;justify-content:center;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--btn-disabled-bg);color:var(--brand);margin-top:12px;border:none;}
.btn.danger-soft{background:var(--btn-disabled-bg);color:#ef4444;margin-top:12px;border:none;}
.btn:disabled{background:var(--btn-disabled-bg)!important;color:var(--btn-disabled-text)!important;cursor:not-allowed;transform:none!important;}
.btn.hidden{display:none;}

/* slide to complete */
.slide-label-base{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--brand);pointer-events:none;z-index:1;}
.slide-knob{position:absolute;left:0;top:0;height:100%;width:52px;border-radius:999px;background:var(--brand);display:flex;align-items:center;justify-content:flex-end;padding-right:16px;z-index:2;cursor:grab;will-change:width;box-shadow:0 4px 12px rgba(36,83,245,.3);}
.slide-knob span{font-size:18px;color:white;font-weight:700;}
.slide-label-white{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:white;pointer-events:none;z-index:3;clip-path:inset(0 100% 0 0);will-change:clip-path;}

/* ── OVERLAYS ── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,0);z-index:300;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .3s,visibility .3s;display:flex;align-items:flex-end;justify-content:center;}
.overlay.show{visibility:visible;opacity:1;pointer-events:auto;}
.sheet{width:100%;background:white;border-radius:28px 28px 0 0;padding:24px 24px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;max-height:90vh;overflow-y:auto;scrollbar-width:none;box-shadow:0 -8px 40px rgba(15,23,42,.12);}
.sheet::-webkit-scrollbar{display:none;}
.overlay.show .sheet{transform:none;}
.sheet-handle{display:none;}

/* ── INLINE CONFETTI FALLBACK ── */
function fireConfetti(){
  const canvas=document.getElementById('confettiCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const pieces=[];
  const colors=['#2453f5','#16a34a','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316'];
  for(let i=0;i<140;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:canvas.height*0.4+Math.random()*canvas.height*0.2,
      r:Math.random()*6+3,
      d:Math.random()*140,
      color:colors[Math.floor(Math.random()*colors.length)],
      tilt:Math.random()*10-10,
      tiltAngle:0,
      tiltAngleInc:Math.random()*.07+.05,
      vx:(Math.random()-0.5)*8,
      vy:-(Math.random()*12+6),
      gravity:.4,
      alpha:1,
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.tiltAngle+=p.tiltAngleInc;
      p.x+=p.vx;
      p.vy+=p.gravity;
      p.y+=p.vy;
      p.tilt=Math.sin(p.tiltAngle)*12;
      p.alpha-=0.012;
      if(p.alpha<=0) return;
      ctx.globalAlpha=Math.max(0,p.alpha);
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.ellipse(p.x,p.y,p.r,p.r*0.4,p.tilt,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha=1;
    frame++;
    if(frame<120) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}
</script>

/* ── AUDIO ── */
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function playCelebration(){
  try{initAudio();const now=audioCtx.currentTime;
    const notes=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5],nd=.06;
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type="sawtooth";o.frequency.value=f;const st=now+i*nd;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.2,st+.01);g.gain.linearRampToValueAtTime(0,st+nd);o.start(st);o.stop(st+nd+.05);});
    const ct=now+notes.length*nd;[523.25,659.25,783.99,1046.5].forEach(f=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type="sawtooth";o.frequency.value=f;g.gain.setValueAtTime(0,ct);g.gain.linearRampToValueAtTime(.15,ct+.05);g.gain.exponentialRampToValueAtTime(.001,ct+1.5);o.start(ct);o.stop(ct+1.5);});
  }catch(e){}
}

function getStreak(){return parseInt(localStorage.getItem(LS.streak)||"0",10);}
function setStreak(n){localStorage.setItem(LS.streak,String(Math.max(0,n)));}
function getWeekCount(){return parseInt(localStorage.getItem(LS.weekCount)||"0",10);}
function setWeekCount(n){localStorage.setItem(LS.weekCount,String(n));}
function getWeekCounted(){return localStorage.getItem(LS.weekCounted)==="1";}
function setWeekCounted(v){localStorage.setItem(LS.weekCounted,v?"1":"0");}
function ensureWeekState(){const cur=isoWeekKey(),stored=localStorage.getItem(LS.weekKey);if(!stored){localStorage.setItem(LS.weekKey,cur);setWeekCount(0);setWeekCounted(false);return;}if(stored!==cur){if(getWeekCount()<3)setStreak(0);localStorage.setItem(LS.weekKey,cur);setWeekCount(0);setWeekCounted(false);}}
function incrementStreak(){let c=getWeekCount()+1;setWeekCount(c);if(c>=3&&!getWeekCounted()){setStreak(getStreak()+1);setWeekCounted(true);}}

function triggerGeneration(){
  actionsArea.classList.add("faded");
  actionsArea.style.display='none';
  document.querySelector('.app').style.paddingBottom='0';
  $('#pageDots').style.opacity='0';$('#pageDots').style.pointerEvents='none';

  requestAnimationFrame(()=>aiStage.classList.add("show"));

    aiStage.classList.remove("show");
    setTimeout(()=>{aiStage.style.display="none";actionsArea.classList.remove("faded");renderPreviewCard();goPreview();},250);
  },900);
}

function generateExercises(){
  const cats=wizBodyType==="upper"?UPPER_CATS:wizBodyType==="lower"?LOWER_CATS:FULL_CATS;
  let pool=[];
  const PROB_W={high:3,med:2,low:1};
  cats.forEach(cat=>{(library[cat]||[]).filter(e=>!e.hidden).forEach(e=>{
    const w=PROB_W[e.prob||'high'];
    for(let i=0;i<w;i++) pool.push({name:e.name,tag:cat,weightable:!!e.weightable});
  });});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const minCount=3, maxCount=5;
  const count=Math.min(pool.length, minCount+Math.floor(Math.random()*(maxCount-minCount+1)));
  let selected=[],usedNames=new Set();
  cats.forEach(cat=>{if(selected.length>=count)return;const pick=pool.find(e=>e.tag===cat&&!usedNames.has(e.name));if(pick){selected.push(pick);usedNames.add(pick.name);}});
  pool.forEach(e=>{if(selected.length>=count)return;if(!usedNames.has(e.name)){selected.push(e);usedNames.add(e.name);}});
  const exercises=selected.slice(0,count).map(e=>({name:e.name,tag:e.tag,weight:null,target:0,repsLogged:0,done:false,baselineReps:0,weightable:!!e.weightable}));
  // assign weight to at most 1 exercise — only weightable exercises eligible
  if(wizWeighted){
    const weightable=exercises.filter(e=>e.weightable);
    if(weightable.length>0){
      const pick=weightable[Math.floor(Math.random()*weightable.length)];
      pick.weight=WEIGHTS[Math.floor(Math.random()*WEIGHTS.length)];
    }
  }
  return exercises;
}

}

/* ── WORKOUT SCREEN (ACCORDION + SHARED NUMPAD) ── */
const wsAccordionList=$('#wsAccordionList');
const wsSharedLog=$('#wsSharedLog');
const wsNumpad=$('#wsNumpad');

let wsInputs=[];
let openAccIdx=0;

function buildAccordions(){
  wsAccordionList.innerHTML="";
  wsInputs=currentExercises.map(()=>"");
  currentExercises.forEach((_,i)=>wsAccordionList.appendChild(makeAccordion(i)));
  openAcc(0,false);
}

function makeAccordion(i){
  const ex=currentExercises[i];
  const meta=ex.weight?`${ex.target} reps · ${ex.weight}kg`:`${ex.target} reps`;

  const card=document.createElement("div");
  card.className="ws-acc";
  card.id=`wsAcc${i}`;
  card.innerHTML=`
    <div class="ws-acc-header" data-i="${i}">
      <div class="ws-acc-left">
        <div class="ws-acc-icon" id="wsAccIcon${i}">${i+1}</div>
        <div class="ws-acc-info">
          <div class="ws-acc-name">${ex.name}</div>
          <div class="ws-acc-meta">${meta}</div>
        </div>
      </div>
      <div class="ws-acc-right">
        <div class="ws-acc-tally" id="wsAccTally${i}">0</div>
        <div class="ws-acc-check" id="wsAccCheck${i}"></div>
      </div>
    </div>
    <div class="ws-acc-body">
      <div class="ws-acc-inner">
        <div class="ws-acc-bignum" id="wsAccNum${i}">0</div>
        <div class="ws-acc-sublabel" id="wsAccSub${i}">${ex.target} reps left</div>
        <div class="ws-acc-bar-wrap"><div class="ws-acc-bar" id="wsAccBar${i}" style="width:0%"></div></div>
      </div>
    </div>`;

  card.querySelector('.ws-acc-header').addEventListener("click",()=>{
    if(openAccIdx===i){
      animateAccBody(card, false);
      openAccIdx=null;
      return;
    }
    openAcc(i,true);
  });

  return card;
}

function animateAccBody(card, open){
  const body=card.querySelector(".ws-acc-body");
  if(!body) return;
  if(open){
    body.style.transition="height .55s cubic-bezier(.25,.1,.1,1), opacity .45s cubic-bezier(.25,.1,.1,1)";
    body.style.height="0px";
    body.style.opacity="0";
    card.classList.add("open");
    const target=body.scrollHeight;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      body.style.height=target+"px";
      body.style.opacity="1";
    }));
    body.addEventListener("transitionend",function h(e){
      if(e.propertyName!=="height") return;
      body.style.height="auto";
      body.removeEventListener("transitionend",h);
    },{once:false});
  } else {
    body.style.transition="height .45s cubic-bezier(.4,0,.2,1), opacity .3s cubic-bezier(.4,0,.2,1)";
    const current=body.scrollHeight;
    body.style.height=current+"px";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      body.style.height="0px";
      body.style.opacity="0";
    }));
    body.addEventListener("transitionend",function h(e){
      if(e.propertyName!=="height") return;
      card.classList.remove("open");
      body.removeEventListener("transitionend",h);
    },{once:false});
  }
}

function openAcc(i, animate){
  if(openAccIdx!==null && openAccIdx!==i){
    const prev=$(`#wsAcc${openAccIdx}`);
    if(prev) animateAccBody(prev, false);
  }
  openAccIdx=i;
  const card=$(`#wsAcc${i}`);
  if(!card) return;
  animateAccBody(card, true);
  if(animate){
    setTimeout(()=>card.scrollIntoView({behavior:"smooth",block:"nearest"}),80);
  }
  refreshSharedControls();
}

function refreshSharedControls(){
  const i=openAccIdx;
  if(i===null) return;
  refreshAcc(i);
}

function refreshAcc(i){
  const ex=currentExercises[i];
  const input=wsInputs[i]||"";
  const logged=ex.repsLogged, target=ex.target||1;
  const left=Math.max(0,target-logged);
  const pct=Math.min(100,Math.round((logged/target)*100));

  const numEl=$(`#wsAccNum${i}`);
  const barEl=$(`#wsAccBar${i}`);
  const subEl=$(`#wsAccSub${i}`);
  const tallyEl=$(`#wsAccTally${i}`);
  const checkEl=$(`#wsAccCheck${i}`);
  const card=$(`#wsAcc${i}`);

  // big number: show input buffer or logged total
  const display=input||String(logged);
  if(numEl){ numEl.textContent=display; numEl.classList.toggle("typing",input.length>0); }
  if(barEl) barEl.style.width=pct+"%";

  // sublabel
  if(subEl){
    if(ex.done) subEl.textContent="✓ Complete!";
    else if(input){
      const pending=parseInt(input,10)||0;
      const newLeft=Math.max(0,left-pending);
      subEl.textContent=newLeft===0?"Hits target!":`${newLeft} left after log`;
    } else {
      subEl.textContent=left===0?"✓ Complete!":`${left} reps left`;
    }
  }

  if(tallyEl){ tallyEl.textContent=logged; tallyEl.className="ws-acc-tally"+(ex.done?" done-tally":""); }
  if(checkEl) checkEl.textContent=ex.done?"✓":"";
  if(card) card.classList.toggle("done",!!ex.done);

  // shared log button
  const hasInput=input.length>0&&parseInt(input,10)>0;
  wsSharedLog.disabled=!hasInput||ex.done;
}

function checkAccDone(i){
  const ex=currentExercises[i];
  if(ex.repsLogged>=ex.target){
    ex.done=true;
    refreshAcc(i);
    setTimeout(()=>{
      const next=currentExercises.findIndex((e,j)=>j>i&&!e.done);
      const any=currentExercises.findIndex(e=>!e.done);
      if(next!==-1) openAcc(next,true);
      else if(any!==-1) openAcc(any,true);
      else{
        const card=$(`#wsAcc${i}`);if(card)card.classList.remove("open");
        openAccIdx=null;
        wsSharedLog.disabled=true;
        updateSlideVisibility();
      }
    },300);
  }
  updateSlideVisibility();
}

/* shared numpad */
wsNumpad.addEventListener("click",e=>{
  const btn=e.target.closest(".ws-nk,.nk-confirm");if(!btn)return;
  const i=openAccIdx;if(i===null)return;
  const ex=currentExercises[i];if(ex.done)return;
  const v=btn.dataset.v;
  if(v==="confirm"){
    const n=parseInt(wsInputs[i],10);if(!n||n<=0)return;
    initAudio();
    ex.repsLogged+=n;
    wsInputs[i]="";
    const numEl=$(`#wsAccNum${i}`);
    if(numEl){numEl.classList.remove("bump");requestAnimationFrame(()=>numEl.classList.add("bump"));setTimeout(()=>numEl.classList.remove("bump"),200);}
    refreshAcc(i);
    checkAccDone(i);
  } else if(v==="del") wsInputs[i]=wsInputs[i].slice(0,-1);
  else if(v==="clear") wsInputs[i]="";
  else{ if(!wsInputs[i]&&v==="0")return; if(wsInputs[i].length<3)wsInputs[i]+=v; }
  if(v!=="confirm") refreshAcc(i);
});

// keep aliases for goWorkout/completeWorkout compatibility
function renderWsPanel(){ buildAccordions(); }
function switchExercise(idx){ openAcc(idx,true); }
function updateWsDisplay(){ if(openAccIdx!==null) refreshAcc(openAccIdx); }

function updateSlideVisibility(){
  if(currentExercises.every(e=>e.done)){
    setTimeout(()=>completeWorkout(), 600);
  }
}

/* ── TIMER ── */
function startTimer(){
  timerSec=0;wsTimer.textContent="0:00";
  timerInterval=setInterval(()=>{timerSec++;wsTimer.textContent=fmtTime(timerSec);},1000);
}
function stopTimer(){clearInterval(timerInterval);timerInterval=null;}

/* ── SLIDER ── */
let sliding=false,startX=0,curW=52,rafPend=false,pendW=52;
function applySlideT(on){if(on){slideKnob.style.transition="width .2s ease-out";slideWhite.style.transition="clip-path .2s ease-out";}else{slideKnob.style.transition="none";slideWhite.style.transition="none";}}
function setSlide(w){const cw=slideWrap.getBoundingClientRect().width;w=Math.max(52,Math.min(w,cw));curW=w;slideKnob.style.width=`${w}px`;slideWhite.style.clipPath=`inset(0 ${100-(w/cw)*100}% 0 0)`;}
function applySlide(px){pendW=px;if(rafPend)return;rafPend=true;requestAnimationFrame(()=>{rafPend=false;setSlide(pendW);});}
slideKnob.addEventListener("pointerdown",e=>{sliding=true;slideKnob.setPointerCapture(e.pointerId);applySlideT(false);startX=e.clientX;if(navigator.vibrate)navigator.vibrate(10);});
slideKnob.addEventListener("pointermove",e=>{if(!sliding)return;const d=e.clientX-startX;if(d<0)return;applySlide(52+d);});
function finishSlide(e){if(!sliding)return;sliding=false;try{slideKnob.releasePointerCapture(e.pointerId);}catch{}const cw=slideWrap.getBoundingClientRect().width;if(curW>cw*.9){applySlideT(true);setSlide(cw);completeWorkout();}else{applySlideT(true);setSlide(52);}}
slideKnob.addEventListener("pointerup",finishSlide);slideKnob.addEventListener("pointercancel",finishSlide);
window.addEventListener("pointerup",finishSlide,{passive:true});window.addEventListener("pointercancel",finishSlide,{passive:true});

/* ── COMPLETE ── */
let workoutCompleted=false;
function completeWorkout(){
  if(workoutCompleted)return;
  workoutCompleted=true;
  stopTimer();initAudio();playCelebration();
  summaryList.innerHTML="";summaryTime.textContent=fmtTime(timerSec);
  let hasPB=false;
  currentExercises.forEach((ex,i)=>{
    const key=ex.weight?`${ex.name}_${ex.weight}kg`:ex.name;
    const prev=pbStore[key]||0,cur=ex.repsLogged,isPB=cur>prev;
    if(isPB){pbStore[key]=cur;hasPB=true;}
    const el=document.createElement("div");el.className="result-item";el.style.animationDelay=(i*.12)+"s";
    const ws=ex.weight?` @ ${ex.weight}kg`:"";
    el.innerHTML=`<div><div class="r-name">${ex.name}${ws}</div>${isPB?`<div style="font-size:12px;color:var(--sub);margin-top:2px">Prev best: ${prev}</div>`:""}</div><div class="r-tags"><span class="pill ${PILL_MAP[ex.tag]||''}">${ex.tag}</span>${isPB?'<span class="pill pill-pb">PB 🏆</span>':""}<div class="r-reps">${cur}</div></div>`;
    summaryList.appendChild(el);
  });
  saveJSON(LS.pbStore,pbStore);
  workoutHistory.push({date:todayKey(),type:wizBodyType==="upper"?"Upper Body":wizBodyType==="lower"?"Lower Body":"Full Body",weighted:wizWeighted,durationSec:timerSec,exercises:currentExercises.map(e=>({name:e.name,tag:e.tag,weight:e.weight||null,baseline:e.baselineReps,target:e.target,reps:e.repsLogged}))});
  saveJSON(LS.history,workoutHistory);
  ensureWeekState();incrementStreak();
  summaryOverlay.classList.add("show");
  requestAnimationFrame(()=>fireConfetti());
}

/* ── HISTORY PANEL SWIPE ── */
const historyPanel=$('#historyPanel');
const historyPanelCount=$('#historyPanelCount');
const pagesTrack=$('#pagesTrack');

function setDots(historyActive){
  $('#dotHistory').classList.toggle("active", historyActive);
  $('#dotHome').classList.toggle("active", !historyActive);
}



function openHistory(){
  // close any open overlays first
  wizardOverlay.classList.remove("show");
  renderHistory();
  $('#hTabHistory').classList.add("active");
  $('#hTabRecords').classList.remove("active");
  $('#historyList').style.display="";
  $('#recordsList').style.display="none";
  pagesTrack.classList.add("show-history");
  setDots(true);
}
function closeHistory(){
  pagesTrack.classList.remove("show-history");
  setDots(false);
}

$('#hTabHistory').addEventListener("click",()=>{
  $('#hTabHistory').classList.add("active");
  $('#hTabRecords').classList.remove("active");

  $('#recordsList').style.display="none";

$('#hTabRecords').addEventListener("click",()=>{

  $('#hTabHistory').classList.remove("active");

  $('#historyList').style.display="none";
  renderRecords();

// swipe to open/close history — iOS Home Screen style
let swipeStartX=0,swipeStartY=0,swipeDx=0,swipeLocked=false,swipeActive=false;

function trackPx(){
  // 0 = home, -innerWidth = history
  return pagesTrack.classList.contains("show-history") ? -window.innerWidth : 0;
}
function snapTrack(toHistory){
  pagesTrack.style.transition="";
  pagesTrack.style.transform="";
  if(toHistory){
    pagesTrack.classList.add("show-history");
    renderHistory();
  } else {
    pagesTrack.classList.remove("show-history");
  }
  setDots(toHistory);
}

document.addEventListener("touchstart",e=>{
  if(appState!=="home") return;
  if(wizardOverlay.classList.contains("show")) return;
  if(exerciseModal.classList.contains("show")) return;
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
  swipeDx=0; swipeLocked=false; swipeActive=true;
},{passive:true});

document.addEventListener("touchmove",e=>{
  if(!swipeActive||appState!=="home") return;
  const dx=e.touches[0].clientX-swipeStartX;
  const dy=e.touches[0].clientY-swipeStartY;
  if(!swipeLocked){
    if(Math.abs(dx)<5&&Math.abs(dy)<5) return;
    if(Math.abs(dy)>=Math.abs(dx)){swipeActive=false;return;} // vertical scroll, ignore
    swipeLocked=true;
  }
  swipeDx=dx;
  const base=trackPx();
  const clamped=Math.min(0,Math.max(-window.innerWidth, base+dx));
  pagesTrack.style.transition="none";
  pagesTrack.style.transform=`translateX(${clamped}px)`;
},{passive:true});

document.addEventListener("touchend",()=>{
  if(!swipeActive||!swipeLocked){swipeActive=false;return;}
  swipeActive=false;
  const isOpen=pagesTrack.classList.contains("show-history");
  const threshold=window.innerWidth*0.25;
  if(!isOpen && swipeDx<-threshold) snapTrack(true);   // swipe left → open history
  else if(isOpen && swipeDx>threshold) snapTrack(false); // swipe right → close history
  else snapTrack(isOpen); // rubber-band back
},{passive:true});

function renderHistory(){
  historyList.innerHTML="";
  historyPanelCount.textContent=workoutHistory.length?`${workoutHistory.length} session${workoutHistory.length===1?"":"s"}`:"";

  // build true PBs: highest reps ever per exercise key
  const truePB={};
  workoutHistory.forEach(s=>{
    (s.exercises||[]).forEach(x=>{
      const key=x.weight?`${x.name}_${x.weight}kg`:x.name;
      if((x.reps||0)>(truePB[key]||0)) truePB[key]=x.reps||0;
    });
  });

  if(!workoutHistory.length){
    historyList.innerHTML=`<div class="h-empty">No workouts yet.<br>Complete your first session to see it here.</div>`;
    return;
  }
  workoutHistory.slice().reverse().forEach((session,i)=>{
    const orig=workoutHistory.length-1-i;
    const dur=session.durationSec?fmtTime(session.durationSec):"";
    const totalReps=session.exercises?session.exercises.reduce((s,x)=>s+(x.reps||0),0):0;
    const card=document.createElement("div");
    card.className="h-card";
    const exRows=session.exercises?session.exercises.map(x=>{
      const key=x.weight?`${x.name}_${x.weight}kg`:x.name;
      const isPB=(x.reps||0)>0&&(x.reps||0)===truePB[key];
      const weightPill=x.weight?`<span class="pill pill-weight">${x.weight}kg</span>`:"";
      const pb=isPB?`<span class="h-trophy">🏆</span>`:"";
      return `<div class="h-ex-row">
        <div class="h-ex-reps">${x.reps||0}</div>
        <span class="h-ex-name">${x.name}</span>
        ${x.weight?`<span class="pill pill-weight" style="font-size:11px;">${x.weight}kg</span>`:""}
        <span class="pill ${PILL_MAP[x.tag]||''} h-ex-pill">${x.tag}</span>
      </div>`;
    }).join(""):"";
    card.innerHTML=`
      <div class="h-card-head">
        <div>
          <div class="h-card-label">Workout</div>
          <div class="h-card-title">${session.type||"Workout"}</div>
          <div class="h-card-meta">${formatDate(session.date)}${dur?" · "+dur:""}${session.weighted?" · Weighted":""}</div>
        </div>
        <div class="h-card-total">
          <div class="h-card-total-num">${totalReps}</div>
          <div class="h-card-total-label">total reps</div>
        </div>
      </div>
      <div class="h-ex-list">${exRows}</div>
      <div class="h-card-footer"><button class="h-del-btn" data-idx="${orig}">Delete</button></div>`;
    historyList.appendChild(card);
  });
}

function renderRecords(){
  const recordsList=$('#recordsList');
  recordsList.innerHTML="";

  // build records per category
  const cats=["push","pull","legs","shoulders","abs","cardio"];
  const records={}; // {cat: [{name, key, reps}]}
  workoutHistory.forEach(s=>{
    (s.exercises||[]).forEach(x=>{
      const br=x.baseline||0;
      if(!x.tag||!(br>0)) return;
      const key=x.weight?`${x.name}_${x.weight}kg`:x.name;
      if(!records[x.tag]) records[x.tag]={};
      if(br>(records[x.tag][key]?.reps||0)){
        records[x.tag][key]={name:x.name,weight:x.weight,reps:br};
      }
    });
  });

  const hasSomething=cats.some(c=>records[c]&&Object.keys(records[c]).length);
  if(!hasSomething){
    recordsList.innerHTML=`<div class="h-empty">No baseline records yet.<br>Run "Find Your Baseline" to set your first records.</div>`;
    return;
  }

  cats.forEach(cat=>{
    const entries=records[cat];
    if(!entries||!Object.keys(entries).length) return;
    const card=document.createElement("div");
    card.className="h-card";
    const rows=Object.values(entries).sort((a,b)=>b.reps-a.reps).map(e=>{
      return `<div class="h-ex-row">
        <div class="h-ex-reps">${e.reps}</div>
        <span class="h-ex-name">${e.name}</span>
        ${e.weight?`<span class="pill pill-weight" style="font-size:11px;">${e.weight}kg</span>`:""}
      </div>`;
    }).join("");
    card.innerHTML=`
      <div class="h-card-head" style="padding-bottom:10px;">
        <div>
          <div class="h-card-label">Personal Records</div>
          <div class="h-card-title" style="text-transform:capitalize;">${cat}</div>
        </div>
      </div>
      <div class="h-ex-list">${rows}</div>`;
    recordsList.appendChild(card);
  });
}
historyList.addEventListener("click",e=>{
  const btn=e.target.closest(".h-del-btn");if(!btn)return;
  const idx=parseInt(btn.dataset.idx,10);
  showConfirm("Delete this session?","This can't be undone.",()=>{workoutHistory.splice(idx,1);saveJSON(LS.history,workoutHistory);renderHome();renderHistory();},"Delete");
});

/* ── EXERCISE MODAL ── */
const exerciseModal=$('#exerciseModal');
const closeExerciseModal=$('#closeExerciseModal');
const exTabs=$('#exTabs');
const exList=$('#exList');
const exAddName=$('#exAddName');
const exAddBtn=$('#exAddBtn');

const EX_TAB_ORDER=["push","pull","legs","shoulders","abs","cardio"];
let exActiveTab="push";

function openExerciseModal(){
  exActiveTab="push";
  renderExTabs();renderExList();
  exerciseModal.classList.add("show");
}
function closeExerciseModalFn(){
  exerciseModal.classList.remove("show");

  saveJSON(LS.library,library);
}

closeExerciseModal.addEventListener("click",closeExerciseModalFn);
const editExBtn=$('#editExBtn');
editExBtn.addEventListener("click",()=>{
  const editing=exList.classList.toggle("editing");
  editExBtn.textContent=editing?"Done Editing":"Edit";
  editExBtn.style.color=editing?"var(--brand)":"";
});
exerciseModal.addEventListener("click",e=>{if(e.target===exerciseModal)closeExerciseModalFn();});

function renderExTabs(){
  exTabs.innerHTML="";
  EX_TAB_ORDER.forEach(k=>{
    const b=document.createElement("button");
    b.className="ex-tab"+(k===exActiveTab?" active":"");
    b.textContent=k.charAt(0).toUpperCase()+k.slice(1);
    b.addEventListener("click",()=>{exActiveTab=k;renderExTabs();renderExList();});
    exTabs.appendChild(b);
  });
}

function renderExList(){
  exList.innerHTML="";
  if(!library[exActiveTab])library[exActiveTab]=[];
  library[exActiveTab].forEach((item,idx)=>{
    const wrap=document.createElement("div");
    wrap.className="ex-item"+(item.hidden?" ex-hidden":"");

    const nameIn=document.createElement("input");nameIn.className="ex-item-name";nameIn.value=item.name||"";
    nameIn.addEventListener("input",()=>{library[exActiveTab][idx].name=nameIn.value;saveJSON(LS.library,library);});

    const eyeBtn=document.createElement("button");eyeBtn.className="ex-vis-btn";
    eyeBtn.innerHTML=item.hidden
      ?`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
      :`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    eyeBtn.addEventListener("click",e=>{e.stopPropagation();item.hidden=!item.hidden;saveJSON(LS.library,library);renderExList();});

    // long press = toggle ALL in category
    let lpTimer=null;
    eyeBtn.addEventListener("pointerdown",()=>{
      lpTimer=setTimeout(()=>{
        lpTimer=null;
        const allHidden=library[exActiveTab].every(ex=>ex.hidden);
        library[exActiveTab].forEach(ex=>ex.hidden=!allHidden);
        saveJSON(LS.library,library);
        if(navigator.vibrate)navigator.vibrate(40);
        renderExList();
      },500);
    });
    const cancelLp=()=>{if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}};
    eyeBtn.addEventListener("pointerup",cancelLp);
    eyeBtn.addEventListener("pointerleave",cancelLp);

    const delBtn=document.createElement("button");delBtn.className="ex-del-btn";delBtn.textContent="×";
    delBtn.addEventListener("click",e=>{
      e.stopPropagation();
      showConfirm("Delete Exercise",`Remove "${item.name}" from your library?`,()=>{
        library[exActiveTab].splice(idx,1);
        saveJSON(LS.library,library);
        renderExList();
      });
    });

    const kgBtn=document.createElement("button");
    kgBtn.className="ex-kg-btn"+(item.weightable?" active":"");
    kgBtn.textContent="KG";
    kgBtn.title="Toggle weighted";
    kgBtn.addEventListener("click",e=>{e.stopPropagation();item.weightable=!item.weightable;saveJSON(LS.library,library);renderExList();});

    const PROB_CYCLE={high:'med',med:'low',low:'high'};
    const PROB_LABEL={high:'HIGH',med:'MED',low:'LOW'};
    const prob=item.prob||'high';
    const probBtn=document.createElement("button");
    probBtn.className=`ex-prob-btn ${prob}`;
    probBtn.textContent=PROB_LABEL[prob];
    probBtn.addEventListener("click",e=>{
      e.stopPropagation();
      item.prob=PROB_CYCLE[item.prob||'high'];
      saveJSON(LS.library,library);renderExList();
    });

    wrap.appendChild(nameIn);wrap.appendChild(eyeBtn);wrap.appendChild(kgBtn);wrap.appendChild(probBtn);wrap.appendChild(delBtn);
    exList.appendChild(wrap);
  });
}

const checkExAdd=()=>{exAddBtn.disabled=!exAddName.value.trim();};
exAddName.addEventListener("input",checkExAdd);
exAddBtn.addEventListener("click",()=>{
  const n=exAddName.value.trim();
  if(!n)return;
  if(!library[exActiveTab])library[exActiveTab]=[];
  library[exActiveTab].unshift({name:n,hidden:false});
  exAddName.value="";exAddBtn.disabled=true;
  saveJSON(LS.library,library);renderExList();
});

ensureWeekState();renderHome();goHome();
